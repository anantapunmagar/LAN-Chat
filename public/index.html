<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Cpath d='M9 10h14v9H15l-4 4v-4H9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="boot" class="screen-center">
  <div class="spinner"></div>
</div>

<!-- ============ AUTH ============ -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <h1>LAN Chat</h1>
    <p class="auth-sub">Chat, share files, photos & videos on your network</p>

    <div class="auth-tabs" role="tablist">
      <button id="tab-login" class="auth-tab active" type="button">Log in</button>
      <button id="tab-register" class="auth-tab" type="button">Register</button>
    </div>

    <form id="auth-form" autocomplete="on">
      <div class="field hidden" id="field-display">
        <label for="f-display">Display name <span class="opt">(optional)</span></label>
        <input id="f-display" maxlength="48" autocomplete="nickname" placeholder="How others see you">
      </div>
      <div class="field">
        <label for="f-username">Username</label>
        <input id="f-username" required maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. alice">
      </div>
      <div class="field">
        <label for="f-password">Password</label>
        <input id="f-password" type="password" required maxlength="200" autocomplete="current-password" placeholder="Your password">
      </div>
      <div id="auth-error" class="auth-error hidden"></div>
      <button id="auth-submit" class="btn-primary" type="submit">Log in</button>
    </form>
  </div>
</div>

<!-- ============ CHAT ============ -->
<div id="chat-screen" class="chat-screen hidden">
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <aside id="sidebar" class="sidebar">
    <header class="sidebar-header">
      <div class="brand">LAN Chat</div>
      <input id="user-search" type="search" placeholder="Search people…" autocomplete="off" spellcheck="false">
    </header>
    <nav id="conv-list" class="conv-list"></nav>
    <footer class="me-card">
      <div id="me-avatar" class="avatar"></div>
      <div class="me-info">
        <div id="me-name" class="me-name"></div>
        <div class="me-username muted" id="me-username"></div>
      </div>
      <button id="btn-logout" class="icon-btn" title="Log out" aria-label="Log out">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </footer>
  </aside>

  <main class="main" id="main-area">
    <header class="chat-header">
      <button id="btn-sidebar" class="icon-btn only-mobile" title="Menu" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div id="chat-avatar" class="avatar hidden"></div>
      <div class="chat-title-wrap">
        <div id="chat-title" class="chat-title"></div>
        <div id="chat-sub" class="chat-sub"></div>
      </div>
    </header>

    <div id="messages" class="messages">
      <div id="drop-overlay" class="drop-overlay hidden"><div>Drop files to send</div></div>
    </div>

    <div id="typing-bar" class="typing-bar"></div>

    <form id="composer" class="composer" autocomplete="off">
      <div id="progress-wrap" class="progress-wrap hidden"><div id="progress-bar" class="progress-bar"></div></div>
      <div id="attach-strip" class="attach-strip"></div>
      <div class="composer-row">
        <button type="button" id="btn-attach" class="icon-btn big" title="Attach files" aria-label="Attach files">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden>
        <textarea id="msg-input" rows="1" placeholder="Type a message…" Enter to send, Shift+Enter for new line"></textarea>
        <button type="submit" id="btn-send" class="btn-send" title="Send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </form>
  </main>
</div>

<!-- ============ LIGHTBOX ============ -->
<div id="lightbox" class="lightbox hidden" role="dialog" aria-label="Image preview">
  <a id="lb-dl" class="lb-btn" download>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download
  </a>
  <button id="lb-close" class="lb-btn lb-close" title="Close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lb-img" alt="">
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
